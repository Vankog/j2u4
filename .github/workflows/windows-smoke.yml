name: Windows smoke test

on:
  push:
    branches:
      - ci/**
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Run pytest (offline suite)
        run: uv run pytest -v
