name: Smoke test

on:
  push:
    branches:
      - ci/**
  pull_request:
    branches:
      - master

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Run pytest (offline suite)
        run: uv run pytest -v

      - name: Install j2u4 as a tool
        run: uv tool install --from . j2u4

      - name: Smoke-test j2u4 CLI
        run: j2u4 --help
