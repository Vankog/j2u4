[project]
name = "j2u4"
version = "0.4.0"
description = "Sync Tempo worklogs to Unit4 Zeiterfassung via Playwright browser automation"
requires-python = ">=3.11"
dependencies = [
    # Playwright 1.60.0 / chromium-1223 hangs Unit4 networkidle wait — see #11
    "playwright>=1.40.0,<1.60.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Console entry point: `uv tool install --from . j2u4` (or `pipx install .`)
# yields a global `j2u4` command that runs the sync.
[project.scripts]
j2u4 = "j2u4.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
