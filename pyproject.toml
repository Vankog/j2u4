[project]
name = "j2u4"
version = "0.1.0"
description = "Sync Tempo worklogs to Unit4 Zeiterfassung via Playwright browser automation"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Console entry point: `uv tool install --from . j2u4` (or `pipx install .`)
# yields a global `j2u4` command that runs the sync.
[project.scripts]
j2u4 = "sync_tempo_to_unit4:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat module layout — every .py at the repo root is a module.
py-modules = [
    "sync_tempo_to_unit4",
    "unit4_browser",
    "clients",
    "models",
    "patterns",
    "utils",
    "mapping_resolver",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
